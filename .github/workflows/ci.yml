# Continuous integration for the reading list: every target compiled, every test run where it can run.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap job, first: the shared metadata and every target's Kotlin compiled, then the JVM and browser tests.
  # Most expect/actual and source-set mistakes break one target only, so all of them are compiled on every push.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6        # caches dependencies and Gradle's build cache between runs
      # iOS is compiled in the ios job: Room's bundled SQLite for iOS is a C-interop dependency, which needs a Mac
      - name: Compile the shared metadata and every target but iOS
        run: >
          ./gradlew
          :shared:compileCommonMainKotlinMetadata :shared:compileNonAndroidMainKotlinMetadata
          :shared:compileAndroidMain :shared:compileKotlinJvm :shared:compileKotlinWasmJs
      - name: Tests on the JVM (including the sync stories against the real server) and in Chrome
        run: ./gradlew :sync:jvmTest :shared:jvmTest :sync:wasmJsBrowserTest :shared:wasmJsBrowserTest
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Count the tests
        if: always()
        run: |
          python3 .github/test_summary.py "JVM" "*/build/test-results/jvmTest/*.xml"
          python3 .github/test_summary.py "Chrome (Wasm)" "*/build/test-results/wasmJsBrowserTest/*.xml"
      - name: Build what ships
        run: ./gradlew :androidApp:assembleRelease :shared:wasmJsBrowserDistribution :server:installDist
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
      - uses: actions/upload-artifact@v7
        with:
          name: builds
          path: |
            androidApp/build/outputs/apk/release/*.apk
            shared/build/dist/wasmJs/productionExecutable/

  # The shared tests on Android itself, with Android's own SQLite.
  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: ./gradlew :shared:connectedAndroidDeviceTest
      - name: Count the tests
        if: always()
        run: python3 .github/test_summary.py "Android emulator" "shared/build/outputs/androidTest-results/connected/**/*.xml"

  # What only a Mac with Xcode can do: link the iOS framework and run the shared tests on the iOS simulator.
  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Link the framework and run the tests on the simulator
        run: ./gradlew -Pkmp.ios=true :shared:linkDebugFrameworkIosSimulatorArm64 :sync:iosSimulatorArm64Test :shared:iosSimulatorArm64Test
      - name: Count the tests
        if: always()
        run: python3 .github/test_summary.py "iOS simulator" "*/build/test-results/iosSimulatorArm64Test/*.xml"

  # What Swift sees: the same Kotlin, exported twice, and plain Swift snippets type-checked against both.
  # The results go to the swift-results branch, readable without signing in.
  swift:
    needs: check
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: The Objective-C export
        run: ./gradlew :apple:linkDebugFrameworkIosSimulatorArm64
      - name: The Swift export (with the environment an Xcode build phase would provide)
        continue-on-error: true
        run: |
          mkdir -p "$PWD/xcbuild/Frameworks"
          CONFIGURATION=Debug SDK_NAME=iphonesimulator PLATFORM_NAME=iphonesimulator ARCHS=arm64 \
          TARGET_BUILD_DIR="$PWD/xcbuild" BUILT_PRODUCTS_DIR="$PWD/xcbuild" FRAMEWORKS_FOLDER_PATH=Frameworks \
          EXPANDED_CODE_SIGN_IDENTITY=- ENABLE_USER_SCRIPT_SANDBOXING=NO \
          ./gradlew :apple:embedSwiftExportForXcode --stacktrace 2>&1 | tee swift-export.log
      - name: Type-check the snippets against both
        if: always()
        run: |
          mkdir -p out && cp swift-export.log out/ 2>/dev/null || true
          find apple/build xcbuild -maxdepth 6 \( -name "*.swiftmodule" -o -name "*.swiftinterface" -o -name "*.modulemap" -o -name "*.a" -o -name "*.framework" \) > out/swift-export-candidates.txt 2>/dev/null || true
          python3 swift/check.py apple/build/bin/iosSimulatorArm64/debugFramework xcbuild out
      - name: Publish the results to the swift-results branch
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          cp -r out /tmp/out && git checkout --orphan swift-results && git rm -rqf . && cp -r /tmp/out/. . && git add -A
          git commit -qm "Swift export results for ${GITHUB_SHA}" && git push -qf origin swift-results
